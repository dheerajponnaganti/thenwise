name: ci
# Runs on every push (including the ci/<name> snapshot branches pushed before a release) and every pull request.
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # Owner data and eval data never reach the public repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node scripts/scan-owner.mjs
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run check
      # Built first, so the tests that run dist/ run here too.
      - run: npm run build
      - run: npm test
  unit-windows:
    # A warning until it is green twice in a row; then it blocks releases like the rest.
    continue-on-error: true
    # Windows starts each test's processes slowly, and the run has also stalled for hours after printing its results.
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # A test file on Windows can stay alive after its last test, so the run exits once the tests are done.
      - run: node --test-force-exit --import ./test/isolate.mjs --test "test/*.test.ts"
  package:
    # What npm would publish, the CLI's own contract, the plugin manifests and the hooks file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-check.mjs
      - run: node scripts/hooks-check.mjs
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.16', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node bench/fresh/check.mjs
