name: ci
on: [push, pull_request]
jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.16', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm install
      - run: npm run build
      - run: node bench/fresh/check.mjs
  unit:
    # Unit tests run the TypeScript source, which needs Node 26 type stripping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26' }
      - run: npm install
      - run: npm run check
      - run: npm test
