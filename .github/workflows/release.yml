name: release
# A v* tag stages that commit on npm with provenance. No token: npm trusts this workflow file (trusted publishing).
# It goes live only when the owner approves it with 2FA on npmjs.com, so a stolen GitHub login cannot publish alone.
# A pull request that touches the release files runs the same jobs as a dry run.
#
# Repo code runs only in verify and build, which hold no publish rights. The publish job holds them, never checks out the
# repo, and treats the tarball as data.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/npm-readme.mjs
      - scripts/check-versions.mjs
      - scripts/check-plugin-build.mjs
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
permissions: {}
jobs:
  verify:
    if: github.repository == 'dheerajponnaganti/thenwise'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No package cache in a release build, as npm's trusted publishing guide says.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run gate
      - name: The tag matches every version, sits on main, and the plugin build is true
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-versions.mjs --tag "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/check-plugin-build.mjs --release origin/release --tag "$TAG"
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/npm-readme.mjs
      - run: node scripts/pack-check.mjs
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: thenwise-*.tgz
          if-no-files-found: error
          retention-days: 5
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment limits publishing to v* tags. A pull request's dry run has no use for it.
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      id-token: write
    steps:
      # No registry-url: setup-node would write a token line to .npmrc, and npm must use the workflow's identity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Staged publishing needs npm 11.15 or later, which is newer than some Node 24 builds ship.
      # zizmor: ignore[adhoc-packages]
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: npm stage publish ./thenwise-*.tgz --provenance --dry-run
      - name: Stage for the owner's approval, unless a rerun finds it already live
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ -n "$(npm view "thenwise@$version" version 2>/dev/null)" ]; then
            echo "thenwise@$version is already on npm" >> "$GITHUB_STEP_SUMMARY"
          else
            npm stage publish ./thenwise-*.tgz --provenance
            echo "Staged. Approve thenwise@$version with 2FA under Staged Packages on npmjs.com." >> "$GITHUB_STEP_SUMMARY"
          fi
