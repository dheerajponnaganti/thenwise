<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Chats, commits and PRs, and notes are filed into one catalog cabinet on your machine, with no model inside. At the reference desk, seven tools and two quiet hooks hand Claude the right card."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<rect x="24" y="24" width="1232" height="352" rx="14" fill="none" stroke="#1E1C19" stroke-width="1.2" stroke-dasharray="2 6"/><text x="48" y="54" class="type" font-size="13" letter-spacing="2" fill="#6B655B">YOUR MACHINE · NOTHING LEAVES</text>
<g class="sans" font-size="15" fill="#1E1C19">
<g transform="translate(70 90) rotate(-2)" filter="url(#lift)"><rect width="210" height="62" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="16" y="27" class="disp" font-size="19">Your chats</text><text x="16" y="48" class="type" font-size="12" fill="#C8402A">MASKED BEFORE FILING</text></g>
<g transform="translate(70 172) rotate(1)" filter="url(#lift)"><rect width="210" height="62" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="16" y="27" class="disp" font-size="19">Commits and PRs</text><text x="16" y="48" class="type" font-size="12" fill="#6B655B">GIT, GH IF YOU LIKE</text></g>
<g transform="translate(70 254) rotate(-1)" filter="url(#lift)"><rect width="210" height="62" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="16" y="27" class="disp" font-size="19">Your notes</text><text x="16" y="48" class="type" font-size="12" fill="#6B655B">VAULT, PLANS, CLAUDE.MD</text></g></g>
