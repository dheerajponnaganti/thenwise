<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Thenwise. Your code has a past. Now Claude remembers it. A card drawer of your project history, with one index card pulled out and stamped DECIDED."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<text x="72" y="150" class="disp" font-size="96" fill="#1E1C19">Thenwise</text>
<line x1="76" y1="176" x2="520" y2="176" stroke="#1E1C19" stroke-width="2"/><line x1="76" y1="182" x2="520" y2="182" stroke="#1E1C19" stroke-width="0.8"/>
<text x="76" y="226" class="disp" font-size="30" font-style="italic" fill="#1E1C19">Your code has a past.</text>
<text x="76" y="264" class="disp" font-size="30" font-style="italic" fill="#C8402A">Now Claude remembers it.</text>
<text x="76" y="320" class="type" font-size="15" fill="#6B655B" letter-spacing="1">A CARD CATALOG OF EVERY CHAT, COMMIT,</text>
<text x="76" y="344" class="type" font-size="15" fill="#6B655B" letter-spacing="1">PR AND NOTE. KEPT ON YOUR MACHINE.</text>
<g transform="translate(700 250)">
 <rect x="0" y="40" width="500" height="150" rx="6" fill="#E6DCCB" stroke="#1E1C19" stroke-width="2"/>
 <g fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"><rect x="30" y="-10" width="440" height="60" rx="4"/><rect x="40" y="0" width="420" height="60" rx="4"/><rect x="50" y="10" width="400" height="60" rx="4"/></g>
 <g class="type" font-size="11" fill="#6B655B"><rect x="64" y="-24" width="70" height="20" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="74" y="-10">SEP</text><rect x="230" y="-14" width="70" height="20" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="240" y="0">OCT</text></g>
 <rect x="175" y="96" width="150" height="46" rx="4" fill="#F3EDE2" stroke="#1E1C19" stroke-width="1.5"/><text x="250" y="117" text-anchor="middle" class="type" font-size="13" fill="#1E1C19">CACHE · STORAGE</text><text x="250" y="134" text-anchor="middle" class="type" font-size="11" fill="#6B655B">2026</text>
 <circle cx="250" cy="165" r="8" fill="none" stroke="#1E1C19" stroke-width="2"/>
</g>
<g transform="translate(760 40) rotate(-4)" filter="url(#lift)">
 <rect width="420" height="230" rx="6" fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"/>
 <line x1="0" y1="52" x2="420" y2="52" stroke="#C8402A" stroke-width="1.5"/>
 <g stroke="#D8CFC0" stroke-width="1"><line x1="0" y1="86" x2="420" y2="86"/><line x1="0" y1="116" x2="420" y2="116"/><line x1="0" y1="146" x2="420" y2="146"/><line x1="0" y1="176" x2="420" y2="176"/></g>
 <text x="22" y="34" class="type" font-size="16" fill="#23466B">No. t2</text><text x="398" y="34" text-anchor="end" class="type" font-size="16" fill="#1E1C19">06 OCT 2026</text>
 <text x="22" y="80" class="disp" font-size="22" fill="#1E1C19">Cache: one file → eight shards</text>
 <text x="22" y="110" class="sans" font-size="15" fill="#1E1C19">The single file locked up under load,</text>
 <text x="22" y="140" class="sans" font-size="15" fill="#1E1C19">so we reverted it the same day.¹</text>
 <text x="22" y="210" class="type" font-size="12" fill="#6B655B">¹ chat t2 · commit abcdef1 · PR #7</text>
 <g transform="translate(320 176) rotate(-9)"><g class="stamp"><rect x="-70" y="-24" width="140" height="48" rx="5" fill="none" stroke="#C8402A" stroke-width="3.5" opacity="0.88"/><rect x="-63" y="-17" width="126" height="34" rx="3" fill="none" stroke="#C8402A" stroke-width="1.2" opacity="0.8"/><text x="0" y="8" text-anchor="middle" class="type" font-size="21" font-weight="700" letter-spacing="3" fill="#C8402A" opacity="0.9">DECIDED</text></g></g>
</g></svg>
