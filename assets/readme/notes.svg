<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="A card box of Markdown notes: decisions, dead ends, a timeline and file histories, linked together. Open them in any editor, keep them in Git, or in Obsidian if you like it."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<text x="64" y="70" class="disp" font-size="38" fill="#1E1C19">Your notes, as plain Markdown.</text><text x="66" y="102" class="type" font-size="14" letter-spacing="2" fill="#6B655B">NO APP REQUIRED · BRING YOUR EDITOR, OR YOUR OBSIDIAN</text>
<g transform="translate(70 140)"><rect x="0" y="60" width="420" height="160" rx="6" fill="#E6DCCB" stroke="#1E1C19" stroke-width="2"/>
<g class="type" font-size="13" fill="#1E1C19"><g transform="rotate(-2 210 60)"><rect x="24" y="0" width="372" height="56" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="40" y="24">Decisions.md</text><text x="380" y="24" text-anchor="end" fill="#23466B">DECIDED</text></g>
<rect x="34" y="40" width="352" height="56" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="50" y="64">Dead ends.md</text><text x="370" y="64" text-anchor="end" fill="#C8402A">ABANDONED</text>
<rect x="44" y="80" width="332" height="56" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="60" y="104">Timeline.md</text><text x="360" y="104" text-anchor="end" fill="#6B655B">BY DATE</text>
<rect x="54" y="120" width="312" height="56" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="70" y="144">Files/src-cache-ts.md</text></g>
<text x="210" y="248" text-anchor="middle" class="type" font-size="12" fill="#6B655B">_THENWISE/ · LINKED WITH [[WIKI LINKS]]</text></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1E1C19"/></marker></defs>
<g fill="none" stroke="#1E1C19" stroke-width="1.5" marker-end="url(#a)"><path d="M500 220 C 560 220, 570 168, 630 166"/><path d="M500 245 L 630 245"/><path d="M500 270 C 560 270, 570 322, 630 324"/></g>
<g class="sans" font-size="16" fill="#1E1C19"><g transform="translate(640 140)" filter="url(#lift)"><rect width="260" height="52" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="18" y="32">Any text editor</text></g><g transform="translate(640 219)" filter="url(#lift)"><rect width="260" height="52" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="18" y="32">A Git repo, backed up</text></g><g transform="translate(640 298)" filter="url(#lift)"><rect width="260" height="52" rx="4" fill="#FBF7EF" stroke="#8a7f6e"/><text x="18" y="32">Obsidian, if you like it</text></g></g>
<g transform="translate(1090 245)"><g stroke="#1E1C19" stroke-opacity="0.5" stroke-width="1.2"><line x1="0" y1="0" x2="-70" y2="-62"/><line x1="0" y1="0" x2="78" y2="-48"/><line x1="0" y1="0" x2="-60" y2="70"/><line x1="0" y1="0" x2="70" y2="66"/><line x1="-70" y1="-62" x2="-110" y2="-10"/><line x1="78" y1="-48" x2="120" y2="8"/></g>
<circle r="12" fill="#C8402A"/><g fill="#FBF7EF" stroke="#1E1C19" stroke-width="1.5"><circle cx="-70" cy="-62" r="8"/><circle cx="78" cy="-48" r="8"/><circle cx="-60" cy="70" r="7"/><circle cx="70" cy="66" r="8"/><circle cx="-110" cy="-10" r="6"/><circle cx="120" cy="8" r="6"/></g>
<text y="112" text-anchor="middle" class="type" font-size="12" fill="#6B655B">LINKS AND A GRAPH, FOR FREE</text></g></svg>
