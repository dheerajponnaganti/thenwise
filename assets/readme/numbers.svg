<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Library statistics card. 1.7 times more questions answered right, 83 percent against 49. 29 percent fewer tokens per answer. 1.7 times faster, 18 seconds against 31. 84 seconds to remember 2,500 chats."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<g transform="translate(40 30)" filter="url(#lift)"><rect width="1200" height="240" rx="6" fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"/>
<text x="24" y="34" class="type" font-size="14" letter-spacing="2" fill="#23466B">STATISTICS CARD · 54 QUESTIONS · HIDDEN ANSWERS · GRADED BLIND</text><line x1="0" y1="50" x2="1200" y2="50" stroke="#C8402A" stroke-width="1.5"/>
<g stroke="#D8CFC0"><line x1="300" y1="50" x2="300" y2="240"/><line x1="600" y1="50" x2="600" y2="240"/><line x1="900" y1="50" x2="900" y2="240"/></g>
<g class="disp" font-size="62" fill="#1E1C19"><text x="30" y="128">1.7×</text><text x="330" y="128">−29%</text><text x="630" y="128">1.7×</text><text x="930" y="128">84 s</text></g>
<g class="sans" font-size="16" fill="#1E1C19"><text x="32" y="160">more questions answered right</text><text x="332" y="160">tokens per answer</text><text x="632" y="160">faster answers</text><text x="932" y="160">to remember 2,500 chats</text></g>
<g class="type" font-size="13" fill="#6B655B"><text x="32" y="200">83% with · 49% without</text><text x="332" y="200">it finds the card, no hunting</text><text x="632" y="200">18 s with · 31 s without</text><text x="932" y="200">from install to first answer</text></g>
<g stroke="#C8402A" stroke-width="5"><line x1="32" y1="216" x2="220" y2="216"/><line x1="632" y1="216" x2="720" y2="216"/></g><g stroke="#9A958C" stroke-width="5"><line x1="32" y1="226" x2="143" y2="226"/><line x1="632" y1="226" x2="782" y2="226"/></g></g></svg>
