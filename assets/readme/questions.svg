<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Three index cards. Why did we choose X, stamped DECIDED. What did we already try, stamped ABANDONED. What was true on that day, stamped AS OF 06 OCT."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<g transform="translate(40 40)" filter="url(#lift)"><rect width="380" height="250" rx="6" fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"/><line x1="0" y1="46" x2="380" y2="46" stroke="#C8402A" stroke-width="1.5"/><circle cx="190" cy="232" r="6" fill="#F3EDE2" stroke="#8a7f6e"/><text x="20" y="30" class="type" font-size="13" fill="#23466B">CALL No. WHY</text><text x="20" y="86" class="disp" font-size="25" fill="#1E1C19">“Why did we</text><text x="20" y="116" class="disp" font-size="25" fill="#1E1C19">choose X?”</text><text x="20" y="156" class="sans" font-size="15" fill="#1E1C19">Decisions come back with their</text><text x="20" y="178" class="sans" font-size="15" fill="#1E1C19">reasons, straight from the chat</text><text x="20" y="200" class="sans" font-size="15" fill="#1E1C19">where you made them.</text><g transform="translate(300 124) rotate(-8)"><g class="stamp"><rect x="-72" y="-19" width="144" height="38" rx="4" fill="none" stroke="#23466B" stroke-width="3" opacity="0.9"/><text x="0" y="7" text-anchor="middle" class="type" font-size="16" font-weight="700" letter-spacing="2" fill="#23466B">DECIDED</text></g></g></g>
<g transform="translate(450 40)" filter="url(#lift)"><rect width="380" height="250" rx="6" fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"/><line x1="0" y1="46" x2="380" y2="46" stroke="#C8402A" stroke-width="1.5"/><circle cx="190" cy="232" r="6" fill="#F3EDE2" stroke="#8a7f6e"/><text x="20" y="30" class="type" font-size="13" fill="#23466B">CALL No. TRIED</text><text x="20" y="86" class="disp" font-size="25" fill="#1E1C19">“What did we</text><text x="20" y="116" class="disp" font-size="25" fill="#1E1C19">already try?”</text><text x="20" y="156" class="sans" font-size="15" fill="#1E1C19">Dead ends are kept and stamped,</text><text x="20" y="178" class="sans" font-size="15" fill="#1E1C19">so last month’s failed idea</text><text x="20" y="200" class="sans" font-size="15" fill="#1E1C19">has a card and a date.</text><g transform="translate(300 124) rotate(-6)"><g class="stamp"><rect x="-72" y="-19" width="144" height="38" rx="4" fill="none" stroke="#C8402A" stroke-width="3" opacity="0.9"/><text x="0" y="7" text-anchor="middle" class="type" font-size="16" font-weight="700" letter-spacing="2" fill="#C8402A">ABANDONED</text></g></g></g>
<g transform="translate(860 40)" filter="url(#lift)"><rect width="380" height="250" rx="6" fill="#FBF7EF" stroke="#8a7f6e" stroke-width="1.2"/><line x1="0" y1="46" x2="380" y2="46" stroke="#C8402A" stroke-width="1.5"/><circle cx="190" cy="232" r="6" fill="#F3EDE2" stroke="#8a7f6e"/><text x="20" y="30" class="type" font-size="13" fill="#23466B">CALL No. AS OF</text><text x="20" y="86" class="disp" font-size="25" fill="#1E1C19">“What was true</text><text x="20" y="116" class="disp" font-size="25" fill="#1E1C19">on that day?”</text><text x="20" y="156" class="sans" font-size="15" fill="#1E1C19">Time travel. Ask about any date and</text><text x="20" y="178" class="sans" font-size="15" fill="#1E1C19">get what held then, plus the commit</text><text x="20" y="200" class="sans" font-size="15" fill="#1E1C19">to read the code as it was.</text><g transform="translate(300 124) rotate(-5)"><g class="stamp"><rect x="-72" y="-19" width="144" height="38" rx="4" fill="none" stroke="#1E1C19" stroke-width="3" opacity="0.9"/><text x="0" y="7" text-anchor="middle" class="type" font-size="16" font-weight="700" letter-spacing="2" fill="#1E1C19">AS OF 06 OCT</text></g></g></g>
</svg>
