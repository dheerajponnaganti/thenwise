<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1080" viewBox="0 0 2560 1080">
<!--#inline shared/defs.svg-->
<!-- Plate II. What happens after you install: one line of time, four stations, each a specimen in a ring like Plate III. -->
<defs>
<clipPath id="c1"><circle cx="392" cy="500" r="160"/></clipPath>
<clipPath id="c2"><circle cx="984" cy="500" r="160"/></clipPath>
<clipPath id="c3"><circle cx="1576" cy="500" r="160"/></clipPath>
<clipPath id="c4"><circle cx="2168" cy="500" r="160"/></clipPath>
</defs>
<rect width="2560" height="1080" rx="44" fill="#E6DCC5"/>
<rect x="32" y="32" width="2496" height="1016" rx="30" fill="none" stroke="#241C15" stroke-width="4"/>
<rect x="48" y="48" width="2464" height="984" rx="20" fill="none" stroke="#241C15" stroke-width="1.6"/>
<g class="sc" font-size="28" fill="#241C15">
<text x="96" y="104">Plate II.</text>
<text x="1280" y="104" text-anchor="middle">What happens after you install</text>
<text x="2464" y="104" text-anchor="end">Figs. 1 to 4</text>
</g>

<!-- the line of time -->
<path d="M150 250 H2400" stroke="#241C15" stroke-width="3"/>
<path d="M2400 238 L2424 250 L2400 262 Z" fill="#241C15"/>
<circle cx="150" cy="250" r="12" fill="#B3361F"/>
<g class="sc" font-size="26" fill="#241C15" text-anchor="middle">
<text x="150" y="214" text-anchor="start">install</text>
<text x="392" y="214">first session</text>
<text x="984" y="214">every new session</text>
<text x="1576" y="214">while you work</text>
<text x="2168" y="214">whenever you ask</text>
</g>
<g fill="#E6DCC5" stroke="#241C15" stroke-width="3"><circle cx="392" cy="250" r="10"/><circle cx="984" cy="250" r="10"/><circle cx="1576" cy="250" r="10"/><circle cx="2168" cy="250" r="10"/></g>
<g stroke="#241C15" stroke-width="1.6" stroke-dasharray="6 6"><path d="M392 262 V326 M984 262 V326 M1576 262 V326 M2168 262 V326"/></g>

<!-- Fig. 1: your past, laid down in layers -->
<g clip-path="url(#c1)">
<rect x="232" y="340" width="320" height="110" fill="#DCC795"/><rect x="232" y="340" width="320" height="110" fill="url(#stip)"/>
<rect x="232" y="450" width="320" height="100" fill="#C49A5C"/><rect x="232" y="450" width="320" height="100" fill="url(#dash)"/>
<rect x="232" y="550" width="320" height="110" fill="#93A07A"/><rect x="232" y="550" width="320" height="110" fill="url(#shale)"/>
<path d="M232 450 H552 M232 550 H552" stroke="#241C15" stroke-width="2.6"/>
</g>
<g class="sc" font-size="24" fill="#241C15" text-anchor="middle">
<rect x="322" y="384" width="140" height="40" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/><text x="392" y="412">chats</text>
<rect x="312" y="480" width="160" height="40" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/><text x="392" y="508">commits</text>
<rect x="292" y="582" width="200" height="40" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/><text x="392" y="610">plans · notes</text>
</g>

<!-- Fig. 2: the rig on today's ground, the flag where you stopped -->
<g clip-path="url(#c2)">
<rect x="824" y="560" width="320" height="50" fill="#DCC795"/><rect x="824" y="560" width="320" height="50" fill="url(#stip)"/>
<rect x="824" y="610" width="320" height="60" fill="#C49A5C"/><rect x="824" y="610" width="320" height="60" fill="url(#dash)"/>
<path d="M824 560 H1144 M824 610 H1144" stroke="#241C15" stroke-width="2.6"/>
</g>
<g transform="translate(900 380) scale(1.6)">
<g stroke="#241C15" stroke-width="1.6" fill="none" stroke-linejoin="round"><path d="M22 112 L42 28 L62 112"/><path d="M27 92 H57 M31 72 H53 M35 52 H49"/><path d="M27 92 L53 72 M57 92 L31 72 M31 72 L49 52 M53 72 L35 52" stroke-width="0.9"/></g>
<path d="M42 28 V6" stroke="#241C15" stroke-width="1.4"/><path d="M42 6 L70 11 L42 16 Z" fill="#B3361F"/>
</g>
<rect x="957" y="560" width="20" height="42" fill="#EFE6D2" stroke="#241C15" stroke-width="2.4"/>
<circle cx="967" cy="612" r="15" fill="none" stroke="#B3361F" stroke-width="4"/>
<g transform="rotate(-3 1010 420)">
<rect x="1000" y="400" width="124" height="70" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/>
<text x="1062" y="428" class="sc" font-size="18" fill="#B3361F" text-anchor="middle">left off</text>
<text x="1062" y="456" class="mono" font-size="20" fill="#241C15" text-anchor="middle">22:31</text>
</g>

<!-- Fig. 3: a file, and the dead end pinned to it -->
<path d="M1500 360 H1626 L1666 400 V640 H1500 Z" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<path d="M1626 360 V400 H1666" fill="none" stroke="#241C15" stroke-width="2.4"/>
<g stroke="#C4BAA6" stroke-width="6" stroke-linecap="round"><path d="M1524 470 H1620 M1524 500 H1642 M1544 530 H1630 M1544 560 H1600 M1524 590 H1640 M1524 618 H1580"/></g>
<text x="1516" y="436" class="mono" font-size="20" fill="#241C15">src/fetch.ts</text>
<g transform="rotate(-6 1420 520)">
<rect x="1420" y="480" width="200" height="80" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2.4"/>
<text x="1520" y="512" class="sc" font-size="20" fill="#B3361F" text-anchor="middle">dead end</text>
<text x="1520" y="542" class="mono" font-size="20" fill="#241C15" text-anchor="middle">14 Oct</text>
</g>
<path d="M1640 470 L1676 506 M1676 470 L1640 506" stroke="#B3361F" stroke-width="6"/>

<!-- Fig. 4: a bore down to the record that answers -->
<g clip-path="url(#c4)">
<rect x="2008" y="340" width="320" height="70" fill="#DCC795"/><rect x="2008" y="340" width="320" height="70" fill="url(#stip)"/>
<rect x="2008" y="410" width="320" height="70" fill="#C49A5C"/><rect x="2008" y="410" width="320" height="70" fill="url(#dash)"/>
<rect x="2008" y="480" width="320" height="70" fill="#93A07A"/><rect x="2008" y="480" width="320" height="70" fill="url(#shale)"/>
<rect x="2008" y="550" width="320" height="60" fill="#B06A45"/><rect x="2008" y="550" width="320" height="60" fill="url(#brick)"/>
<rect x="2008" y="610" width="320" height="60" fill="#6F8191"/><rect x="2008" y="610" width="320" height="60" fill="url(#rings)"/>
<path d="M2008 410 H2328 M2008 480 H2328 M2008 550 H2328 M2008 610 H2328" stroke="#241C15" stroke-width="2.6"/>
<rect x="2108" y="330" width="20" height="246" fill="#EFE6D2" stroke="#241C15" stroke-width="2.4"/>
</g>
<circle cx="2118" cy="580" r="22" fill="none" stroke="#B3361F" stroke-width="5"/>
<path d="M2144 576 C2170 566 2186 560 2204 548" fill="none" stroke="#241C15" stroke-width="2.2" stroke-dasharray="7 6"/>
<g transform="rotate(-3 2200 520)">
<rect x="2190" y="500" width="140" height="70" rx="4" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/>
<text x="2260" y="528" class="sc" font-size="18" fill="#B3361F" text-anchor="middle">decided</text>
<text x="2260" y="556" class="mono" font-size="20" fill="#241C15" text-anchor="middle">06 Oct</text>
</g>

<!-- the rings round each figure -->
<g fill="none" stroke="#241C15">
<g stroke-width="3"><circle cx="392" cy="500" r="160"/><circle cx="984" cy="500" r="160"/><circle cx="1576" cy="500" r="160"/><circle cx="2168" cy="500" r="160"/></g>
<g stroke-width="1.4"><circle cx="392" cy="500" r="172"/><circle cx="984" cy="500" r="172"/><circle cx="1576" cy="500" r="172"/><circle cx="2168" cy="500" r="172"/></g>
</g>
<g stroke="#241C15" stroke-width="1.6" stroke-dasharray="4 8"><path d="M688 300 V980 M1280 300 V980 M1872 300 V980"/></g>

<!-- the words under each figure -->
<g class="serif" font-size="50" fill="#241C15" text-anchor="middle">
<text x="392" y="770">It reads your past</text>
<text x="984" y="770">It knows where you stopped</text>
<text x="1576" y="770">It warns before an edit</text>
<text x="2168" y="770">It answers with sources</text>
</g>
<g class="serif" font-size="32" fill="#241C15" text-anchor="middle">
<text x="392" y="830">Chats from every tool, commits,</text><text x="392" y="872">plans and notes, masked, on your disk.</text>
<text x="984" y="830">The last session, what landed since,</text><text x="984" y="872">and where another tool stopped.</text>
<text x="1576" y="830">Open a file and its dead ends</text><text x="1576" y="872">and decisions arrive first.</text>
<text x="2168" y="830">Why, what was tried, what holds now,</text><text x="2168" y="872">what was true on any date.</text>
</g>
<g class="mono" font-size="28" fill="#B3361F" text-anchor="middle">
<text x="392" y="940">2,771 chats in 164 s</text>
<text x="984" y="940">a brief, 200 tokens at most</text>
<text x="1576" y="940">600 tokens, once per file</text>
<text x="2168" y="940">eight memory tools</text>
</g>
</svg>
