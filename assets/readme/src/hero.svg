<text x="150" y="540" class="it" font-size="80" fill="#241C15">Your code has a past.</text>
<text x="150" y="632" class="it" font-size="80" fill="#B3361F">Now your agents remember it.</text>
<g class="serif" font-size="40" fill="#241C15">
<text x="150" y="742">Every chat, commit, pull request and note, laid</text>
<text x="150" y="798">down in the order it happened and kept on your</text>
<text x="150" y="854">machine. Ask about any day, and your agent drills</text>
<text x="150" y="910">straight to it.</text>
</g>
