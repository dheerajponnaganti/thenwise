<path d="M98 196 H2454" stroke="#C9BBA0" stroke-width="2"/>
<g fill="none" stroke="#5E4E3E" stroke-width="2.4"><circle cx="134" cy="169" r="9"/><circle cx="162" cy="169" r="9"/><circle cx="190" cy="169" r="9"/></g>
<text x="222" y="179" class="mono" font-size="28" fill="#5E4E3E">thenwise · readings</text>

