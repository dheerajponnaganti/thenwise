<rect x="1370" y="548" width="162" height="40" rx="20" fill="url(#strata)" stroke="#F1E9D6" stroke-width="3"/><text x="1550" y="580" fill="#F1E9D6">14 s with</text>
<rect x="1370" y="608" width="300" height="40" rx="20" fill="url(#hatch)" stroke="#F1E9D6" stroke-width="3"/><text x="1688" y="640" fill="#C9BBA0">26 s</text>
<text x="150" y="712" fill="#9A8F7E" font-size="30">scored against hidden answers</text>
