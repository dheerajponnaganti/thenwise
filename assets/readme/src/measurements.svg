<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1480" viewBox="0 0 2560 1480">
<!--#inline shared/defs.svg-->
<!-- Plate IV. The readings, in one window. Rows I and II are the blind-graded rounds; the stopwatch is a fresh install.
     Every number here has a source in docs/eval.md, which also holds the per-tool runs. -->
<rect width="2560" height="1480" rx="44" fill="#E6DCC5"/>
<rect x="32" y="32" width="2496" height="1416" rx="30" fill="none" stroke="#241C15" stroke-width="4"/>
<rect x="48" y="48" width="2464" height="1384" rx="20" fill="none" stroke="#241C15" stroke-width="1.6"/>
<g class="sc" font-size="28" fill="#241C15">
<text x="96" y="104">Plate IV.</text>
<text x="1280" y="104" text-anchor="middle">Field measurements · hidden answers · graded blind</text>
<text x="2464" y="104" text-anchor="end">Readings</text>
</g>

<!-- the window -->
<rect x="104" y="148" width="2360" height="1260" rx="14" fill="#241C15" opacity="0.18"/>
<rect x="96" y="140" width="2360" height="1260" rx="14" fill="#1E1A16" stroke="#241C15" stroke-width="3"/>
