<text x="1280" y="1220" class="sc" font-size="28" fill="#B3361F" text-anchor="middle">Your machine · search, hooks and tools make no network calls</text>

<!-- three sources -->
<g>
<rect x="140" y="190" width="460" height="150" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="176" y="262" class="serif" font-size="50" fill="#241C15">Your chats</text>
<text x="176" y="308" class="sc" font-size="22" fill="#B3361F">every tool · one memory · masked</text>
<rect x="636" y="190" width="600" height="150" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="676" y="262" class="serif" font-size="50" fill="#241C15">Commits and pull requests</text>
<text x="676" y="308" class="sc" font-size="22" fill="#241C15">git, and gh if you like</text>
<rect x="1272" y="190" width="440" height="150" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="1308" y="262" class="serif" font-size="50" fill="#241C15">Notes and plans</text>
<text x="1308" y="308" class="sc" font-size="22" fill="#241C15">vault, plans, <tspan class="mono" letter-spacing="0">CLAUDE.md</tspan></text>
