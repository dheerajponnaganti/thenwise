<g>
<text x="184" y="530" class="sc" font-size="30" fill="#241C15">Words</text>
<text x="184" y="576" class="it" font-size="38" fill="#241C15">every word of every chat, commit and note, ready to search</text>
<text x="184" y="660" class="sc" font-size="30" fill="#241C15">Dates</text>
<text x="184" y="706" class="it" font-size="38" fill="#241C15">each record knows its day, and what came after it</text>
<text x="184" y="792" class="sc" font-size="30" fill="#241C15">Links</text>
<text x="184" y="838" class="it" font-size="38" fill="#241C15">same file, same pull request, and which record replaced which</text>
<text x="184" y="924" class="sc" font-size="30" fill="#F1E9D6">Decisions and dead ends</text>
<text x="184" y="970" class="it" font-size="38" fill="#F1E9D6">found in chats, kept on purpose, or caught when an edit is undone or a test fails</text>
<text x="184" y="1068" class="sc" font-size="30" fill="#F1E9D6">Files</text>
<text x="184" y="1114" class="it" font-size="38" fill="#F1E9D6">the story of every file you touched</text>
<text x="1290" y="530" class="sc" font-size="28" fill="#B3361F">One local store · no model inside</text>
</g>

