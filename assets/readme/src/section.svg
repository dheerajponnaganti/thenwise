<text x="1280" y="104" text-anchor="middle">How the ground is laid</text>
<text x="2464" y="104" text-anchor="end">Vertical section</text>
</g>

<!-- your machine: the boundary nothing crosses -->
<rect x="92" y="150" width="2376" height="1060" fill="none" stroke="#B3361F" stroke-width="3" stroke-dasharray="18 12"/>
