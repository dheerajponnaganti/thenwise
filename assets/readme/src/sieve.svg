<rect x="136" y="266" width="1000" height="676" rx="12" fill="#241C15" opacity="0.18"/>
<rect x="130" y="258" width="1000" height="676" rx="12" fill="#1E1A16" stroke="#241C15" stroke-width="3"/>
<path d="M131.5 270 a10.5 10.5 0 0 1 10.5 -10.5 H1118 a10.5 10.5 0 0 1 10.5 10.5 V304 H131.5 Z" fill="#F4ECDA"/><path d="M132 304 H1128" stroke="#C9BBA0" stroke-width="2"/>
<g fill="none" stroke="#5E4E3E" stroke-width="2.4"><circle cx="162" cy="282" r="8"/><circle cx="186" cy="282" r="8"/><circle cx="210" cy="282" r="8"/></g>
<text x="238" y="291" class="mono" font-size="26" fill="#5E4E3E">your agent · shop</text>
<g class="sc" font-size="22" fill="#9A8F7E">
<text x="170" y="366">your prompt</text><text x="170" y="490">the agent’s reply</text><text x="170" y="614">tool output</text><text x="170" y="738">a line in the chat</text><text x="170" y="862">a private aside</text>
</g>
<g class="mono" font-size="36">
<text x="170" y="416" fill="#F1E9D6"><tspan fill="#E58A6E">›</tspan> why did we split the cache?</text>
<text x="170" y="540" fill="#F1E9D6">The one cache file locked up…</text>
<text x="170" y="664" fill="#9A8F7E">npm install · 4,212 lines</text>
<text x="170" y="788" fill="#F1E9D6">STRIPE_KEY=sk_live_51H8xQ2…</text>
<text x="170" y="912" fill="#9A8F7E">[no-memory] off the record</text>
</g>

<!-- into the sieve -->
<g fill="none" stroke="#241C15" stroke-width="3">
<path d="M1130 404 C1200 404 1230 470 1316 500" marker-end="url(#ah)"/>
<path d="M1130 528 C1200 528 1240 520 1318 520" marker-end="url(#ah)"/>
