<g fill="none" stroke="#241C15" stroke-width="3">
<path d="M1726 520 C1780 470 1830 380 1880 372" marker-end="url(#ah)"/>
<path d="M1730 540 C1800 520 1840 500 1880 500" marker-end="url(#ah)"/>
<path d="M1724 580 C1800 600 1840 630 1880 628" marker-end="url(#ah)"/>
</g>
<g class="mono" font-size="30">
<rect x="1890" y="320" width="560" height="104" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="1916" y="356" class="sc" font-size="20" fill="#241C15">06 oct · prompt</text><text x="1916" y="404" fill="#241C15">› why did we split the cache?</text>
<rect x="1890" y="448" width="560" height="104" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="1916" y="484" class="sc" font-size="20" fill="#241C15">06 oct · reply</text><text x="1916" y="532" fill="#241C15">The one cache file locked up…</text>
<rect x="1890" y="576" width="560" height="104" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="3"/>
<text x="1916" y="612" class="sc" font-size="20" fill="#241C15">06 oct · masked</text><text x="1916" y="660" fill="#241C15">STRIPE_KEY=<tspan fill="#B3361F">[masked]</tspan></text>
</g>
<path d="M1560 860 C1600 930 1700 940 1880 930" fill="none" stroke="#B3361F" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ahr)"/>
<rect x="1890" y="760" width="560" height="236" rx="4" fill="none" stroke="#B3361F" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1918" y="808" class="sc" font-size="28" fill="#B3361F">Left out</text>
<g class="mono" font-size="30" fill="#241C15">
<text x="1918" y="860">tool noise · not indexed</text>
<text x="1918" y="908">[no-memory] · never kept</text>
<text x="1918" y="956">paused projects · not read</text>
</g>

<!-- the three promises -->
<g class="sc" font-size="32">
<g transform="rotate(-2 700 1110)"><rect x="530" y="1072" width="340" height="72" rx="6" fill="none" stroke="#2F4A6B" stroke-width="4"/><text x="700" y="1120" fill="#2F4A6B" text-anchor="middle">No telemetry</text></g>
<g transform="rotate(1.5 1100 1110)"><rect x="940" y="1072" width="320" height="72" rx="6" fill="none" stroke="#B3361F" stroke-width="4"/><text x="1100" y="1120" fill="#B3361F" text-anchor="middle">No account</text></g>
<g transform="rotate(-1 1580 1110)"><rect x="1340" y="1072" width="480" height="72" rx="6" fill="none" stroke="#241C15" stroke-width="4"/><text x="1580" y="1120" fill="#241C15" text-anchor="middle">Nothing phones home</text></g>
</g>
</svg>
