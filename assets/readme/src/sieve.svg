<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1240" viewBox="0 0 2560 1240">
<!--#inline shared/defs.svg-->
<!-- Plate VIII. What a chat holds pours through the sieve; what is kept lands dated and masked, the rest stays out. -->
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#241C15"/></marker><marker id="ahr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#B3361F"/></marker></defs>
<rect width="2560" height="1240" rx="44" fill="#E6DCC5"/>
<rect x="32" y="32" width="2496" height="1176" rx="30" fill="none" stroke="#241C15" stroke-width="4"/>
<rect x="48" y="48" width="2464" height="1144" rx="20" fill="none" stroke="#241C15" stroke-width="1.6"/>
<g class="sc" font-size="28" fill="#241C15">
<text x="96" y="104">Plate VIII.</text>
<text x="1280" y="104" text-anchor="middle">The sieve · everything passes it before a byte is written</text>
<text x="2464" y="104" text-anchor="end">Fig. 8</text>
</g>
<text x="130" y="224" class="sc" font-size="30" fill="#241C15">What arrives</text>
<text x="1720" y="224" class="sc" font-size="30" fill="#2F4A6B">What is kept</text>

