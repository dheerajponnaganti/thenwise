<rect x="18" y="164" width="324" height="46" rx="6" fill="#F6EFDF" stroke="#241C15" stroke-width="2"/><text x="180" y="194" class="sc" font-size="20" fill="#241C15" text-anchor="middle">raw chats stay here</text>
