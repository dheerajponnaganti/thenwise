<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="The circulation desk. Each teammate keeps a private, locked drawer of chats and memory. Chosen cards, masked, are checked in to a shared team catalog on a server the team owns."><defs><pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#D8CFC0" stroke-width="1" opacity="0.45"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a4a32" flood-opacity="0.18"/></filter><style>.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.type{font-family:"American Typewriter","Courier Prime","Courier New",monospace}.stamp{animation:press 1.1s cubic-bezier(.2,.9,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes press{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.stamp{animation:none}}</style></defs><rect width="100%" height="100%" rx="22" fill="#F3EDE2"/><rect width="100%" height="100%" rx="22" fill="url(#ruled)"/>
<text x="64" y="72" class="disp" font-size="40" fill="#1E1C19">Share a decision. Never a chat.</text><text x="66" y="104" class="type" font-size="14" letter-spacing="2" fill="#6B655B">THE CIRCULATION DESK · YOUR TEAM’S CATALOG, ON A SERVER YOU OWN</text>
<g transform="translate(540 128)"><rect width="200" height="96" rx="6" fill="#E6DCCB" stroke="#1E1C19" stroke-width="2"/><rect x="20" y="16" width="160" height="30" rx="3" fill="#FBF7EF" stroke="#1E1C19"/><text x="100" y="36" text-anchor="middle" class="type" font-size="12" fill="#1E1C19">TEAM CATALOG</text><circle cx="100" cy="72" r="7" fill="none" stroke="#1E1C19" stroke-width="2"/></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1E1C19"/></marker></defs><g fill="none" stroke="#1E1C19" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#a)"><path d="M250 296 C 300 240, 450 200, 530 186"/><path d="M640 296 L 640 232"/><path d="M1030 296 C 980 240, 830 200, 750 186"/></g>



<g transform="translate(300 222) rotate(-4)" filter="url(#lift)"><rect width="176" height="46" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="10" y="18" class="type" font-size="10" fill="#6B655B">SHARED BY ALICE</text><text x="10" y="36" class="sans" font-size="13" fill="#23466B">decision: eight shards</text></g><g transform="translate(652 246) rotate(3)" filter="url(#lift)"><rect width="176" height="46" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="10" y="18" class="type" font-size="10" fill="#6B655B">SHARED BY YOU</text><text x="10" y="36" class="sans" font-size="13" fill="#C8402A">dead end: one cache file</text></g><g transform="translate(812 206) rotate(-3)" filter="url(#lift)"><rect width="176" height="46" rx="3" fill="#FBF7EF" stroke="#8a7f6e"/><text x="10" y="18" class="type" font-size="10" fill="#6B655B">SHARED BY SAM</text><text x="10" y="36" class="sans" font-size="13" fill="#1E1C19">API key → [MASKED]</text></g><g transform="translate(250 300)" filter="url(#lift)"><rect x="-110" y="0" width="220" height="110" rx="5" fill="#E6DCCB" stroke="#1E1C19" stroke-width="1.5"/><rect x="-80" y="22" width="160" height="44" rx="3" fill="#FBF7EF" stroke="#1E1C19"/><text x="0" y="40" text-anchor="middle" class="type" font-size="11" fill="#1E1C19">CHATS · MEMORY</text><text x="0" y="57" text-anchor="middle" class="type" font-size="11" fill="#C8402A">PRIVATE</text><g transform="translate(0 88)"><rect x="-9" y="-6" width="18" height="14" rx="2" fill="#1E1C19"/><path d="M-5 -6 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#1E1C19" stroke-width="2"/></g><text x="0" y="132" text-anchor="middle" class="type" font-size="13" fill="#1E1C19">ALICE</text></g>
<g transform="translate(640 300)" filter="url(#lift)"><rect x="-110" y="0" width="220" height="110" rx="5" fill="#E6DCCB" stroke="#1E1C19" stroke-width="1.5"/><rect x="-80" y="22" width="160" height="44" rx="3" fill="#FBF7EF" stroke="#1E1C19"/><text x="0" y="40" text-anchor="middle" class="type" font-size="11" fill="#1E1C19">CHATS · MEMORY</text><text x="0" y="57" text-anchor="middle" class="type" font-size="11" fill="#C8402A">PRIVATE</text><g transform="translate(0 88)"><rect x="-9" y="-6" width="18" height="14" rx="2" fill="#1E1C19"/><path d="M-5 -6 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#1E1C19" stroke-width="2"/></g><text x="0" y="132" text-anchor="middle" class="type" font-size="13" fill="#1E1C19">YOU</text></g>
<g transform="translate(1030 300)" filter="url(#lift)"><rect x="-110" y="0" width="220" height="110" rx="5" fill="#E6DCCB" stroke="#1E1C19" stroke-width="1.5"/><rect x="-80" y="22" width="160" height="44" rx="3" fill="#FBF7EF" stroke="#1E1C19"/><text x="0" y="40" text-anchor="middle" class="type" font-size="11" fill="#1E1C19">CHATS · MEMORY</text><text x="0" y="57" text-anchor="middle" class="type" font-size="11" fill="#C8402A">PRIVATE</text><g transform="translate(0 88)"><rect x="-9" y="-6" width="18" height="14" rx="2" fill="#1E1C19"/><path d="M-5 -6 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#1E1C19" stroke-width="2"/></g><text x="0" y="132" text-anchor="middle" class="type" font-size="13" fill="#1E1C19">SAM</text></g>
</svg>
